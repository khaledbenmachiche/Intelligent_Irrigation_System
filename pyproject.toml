[project]
name = "intelligent-irrigation-system"
version = "0.1.0"
description = "Intelligent irrigation pipelines with BiLSTM forecasting and API serving"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.4.3",
  "pandas==3.0.1",
  "scikit-learn==1.8.0",
  "scipy==1.17.1",
  "matplotlib==3.10.8",
  "seaborn==0.13.2",
  "PyYAML==6.0.3",
  "joblib==1.5.3",
  "tensorflow-cpu==2.21.0",
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "pyright==1.1.408",
  "ruff==0.15.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
